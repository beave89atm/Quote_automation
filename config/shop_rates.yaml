# Kannon shop rates — REPLACE PLACEHOLDERS with your real numbers.
# Times use effective shop IPM (includes typical repositioning), not pure arc-on speed.

app:
  # Shared password for team access (v1). Leave empty to disable auth gate.
  shared_password: "kannon"
  default_efficiency_pct: 85

# Box-local drawing library (LOM + child PDFs on this Linux box).
# Override with env KANNON_DRAWING_LIBRARY (semicolon-separated paths).
# Do not point this at Kyle's quoting PC.
drawing_library:
  roots: []
  auto_attach_stp: true

weld:
  # Current rates are MANUAL weld only. Robot IPM table will be added later.
  process: manual  # manual | robot (robot not implemented yet)
  # Inches per minute by fillet size — MANUAL (effective shop speed).
  ipm:
    "1/8": 4.0
    "3/16": 3.75
    "1/4": 3.5
    "5/16": 3.0
    "3/8": 2.5
    "1/2": 2.0
  default_ipm: 3.0
  # Placeholder for later:
  # robot_ipm:
  #   "1/8": null
  #   "3/16": null
  #   "1/4": null
  #   "5/16": null
  #   "3/8": null
  #   "1/2": null
  # robot_default_ipm: null

# Fit-up = sum(minutes per piece for each physical piece, by that piece's weight band)
fitup:
  weight_bands:
    - id: lt_20
      label: "<20 lbs"
      max_lb: 20
      with_fixture: { per_piece_minutes: 2.0 }
      no_fixture: { per_piece_minutes: 4.0 }
    - id: "20_50"
      label: "20-50 lbs"
      max_lb: 50
      with_fixture: { per_piece_minutes: 4.0 }
      no_fixture: { per_piece_minutes: 6.0 }
    - id: "50_200"
      label: "50-200 lbs"
      max_lb: 200
      with_fixture: { per_piece_minutes: 7.0 }
      no_fixture: { per_piece_minutes: 10.0 }
    - id: gt_200
      label: ">200 lbs"
      max_lb: null
      with_fixture: { per_piece_minutes: 10.0 }
      no_fixture: { per_piece_minutes: 15.0 }
  # When piece weights are unknown, use this band and flag for review.
  default_band_id: "20_50"

# Rules the takeoff engine should never invent — flag for human review instead.
always_ask:
  - cover_plate_welds_not_named_in_notes
  - kingpin_diameter_if_not_dimensioned
  - ambiguous_both_sides_vs_all_around
