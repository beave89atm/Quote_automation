# Material densities and plate weight helpers for assembly weight estimates.
# Structural steel grades share essentially the same density; grade is tracked for
# labeling / welding notes. Sources: mild steel ~0.2836 lb/in³, 40.8 lb/ft² per inch thick.

default_material: a36

# denser / more specific patterns should appear earlier in detection (see quote_core/weight.py).
materials:
  a656_gr80:
    label: A656 Grade 80
    family: carbon_steel
    density_lb_in3: 0.2836
    psf_per_inch: 40.8
    aliases:
      - "A656 GR 80"
      - "A656 GR80"
      - "A656 GRADE 80"
      - "A656-80"
      - "656 GR 80"
      - "656 GRADE 80"

