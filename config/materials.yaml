# Bounding-box solids overestimate open sections. Apply fill factors by solid kind.
bbox_fill_factor:
  plate: 1.0
  cover: 1.0
  angle: 0.35
  channel: 0.42
  kingpin: 0.78
  other: 0.55
  skip: 0.0

# Plate thickness → lb/ft² for carbon/HSLA steel families. Missing sizes use density formula.
plate_psf_carbon_steel:
  "0.125": 5.10    # 1/8
  "0.1875": 7.65   # 3/16
  "0.25": 10.20    # 1/4
  "0.3125": 12.75  # 5/16
  "0.375": 15.30   # 3/8
  "0.5": 20.40     # 1/2
  "0.625": 25.50   # 5/8
  "0.75": 30.60    # 3/4
  "1.0": 40.80     # 1

# Preferred scan order (specific grades before generic).
detect_order:
  - a656_gr80
  - a656_gr70
  - a656_gr60
  - a572_gr65
  - a572_gr55
  - a572_gr50
  - a572_gr42
  - a516_gr70
  - a514
  - a992
  - a500
  - ar500
  - ar450
  - ar400
  - a36
  - stainless_316
  - stainless_304
  - stainless_300
  - aluminum_6061
  - aluminum_5052
  - aluminum
  - carbon_steel
