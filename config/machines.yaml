# Named mill/lathe roster from Kyle's Mills and Lathes Equipment.xlsx
# (Desktop\Business Items\Equipment Details). Travels / OD / length columns
# in that workbook are EMPTY — do not invent them. max_rpm is unknown.
#
# Shop-level envelopes below are the July 27 2026 capabilities gates and
# remain the quoting limits until Kyle fills per-machine travels.

source: "Mills and Lathes Equipment.xlsx + July 27 2026 capabilities + asset list"
source_status: named_roster_v0
notes:
  - "Names from the xlsx. Hwacheon from the asset list (Mansfield, bought 7/2024; may not be on the xlsx)."
  - "Per-machine travels, OD, length, and max RPM are empty in the source — left null."
  - "Shop gates (not measured travels): lathe 3/8–14 in dia × 12–14 in long, chucks to 26 in; mill cube 20 × 40; 4th-axis to 20 in dia."
  - "July 2026 listed 6 OKK VMCs; the xlsx names 5. Confirm the missing OKK."
  - "July 2026 listed 3 Bridgeport mills; not named on the xlsx — names TBD."

todos:
  - travels_od_length_per_machine
  - max_rpm
  - sfm_ipt_tables
  - tooling_crib
  - per_machine_setup_minutes
  - burden_rates_2026
  - coating_usd_per_sqft
  - missing_okk_if_july_count_was_6
  - bridgeport_names

shop_envelopes:
  cnc_lathe:
    min_diameter_in: 0.375
    max_diameter_in: 14.0
    max_length_in: 14.0
    max_chuck_diameter_in: 26.0
  cnc_mill:
    x_in: 40.0
    y_in: 20.0
    z_in: 20.0
    fourth_axis_diameter_in: 20.0
  manual_lathe:
    min_diameter_in: 0.375
    max_diameter_in: 14.0
    max_length_in: 14.0
    max_chuck_diameter_in: 26.0
  manual_mill:
    x_in: null
    y_in: null
    z_in: null
    fourth_axis_diameter_in: null

.empty_lathe_envelope: &empty_lathe_envelope
  min_diameter_in: null
  max_diameter_in: null
  max_length_in: null
  max_chuck_diameter_in: null

.empty_mill_envelope: &empty_mill_envelope
  x_in: null
  y_in: null
  z_in: null
  fourth_axis_diameter_in: null

