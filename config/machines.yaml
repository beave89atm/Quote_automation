# Kannon machine roster — July 27 2026 capabilities list (starting roster).
# Kyle will send a fuller list later (exact models, HP, max RPM, tooling).
# Add or edit machines here; no code change required.
#
# Empty numeric fields (null) mean "not yet supplied" — the calculator still
# uses shop-level envelopes below and flags parts that exceed them.

source: "Kannon Manufacturing capabilities list, July 27 2026"
source_status: starting_roster
notes:
  - "Exact model numbers, HP, max RPM, and tooling crib are TBD."
  - "Primarily chucker lathes; chucks up to 26 in diameter."
  - "Typical turning envelope: 3/8 through 14 in diameter x 12-14 in long."
  - "Most milling is Cat 50. Shop cube 20 x 40 in. Full 4th-axis up to 20 in diameter."

# Shop-level gates used when a machine has no per-machine envelope.
shop_envelopes:
  cnc_lathe:
    min_diameter_in: 0.375
    max_diameter_in: 14.0
    max_length_in: 14.0
    max_chuck_diameter_in: 26.0
  cnc_mill:
    x_in: 40.0
    y_in: 20.0
    z_in: 20.0
    fourth_axis_diameter_in: 20.0
  manual_lathe:
    min_diameter_in: 0.375
    max_diameter_in: 14.0
    max_length_in: 14.0
    max_chuck_diameter_in: 26.0
  manual_mill:
    x_in: 18.0
    y_in: 12.0
    z_in: 5.0
    fourth_axis_diameter_in: null

