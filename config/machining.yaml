  mill_setup_source: stale_2021_sectura_book
  cnc_lathe: 20
  cnc_lathe_live_tooling: 30
  cnc_mill_3axis: 20
  cnc_mill_4axis: 20
  cnc_mill_horizontal: 20
  robodrill: 20
  manual_mill: 20
  manual_lathe: 25

