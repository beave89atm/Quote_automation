# Machining calculator rates and tooling hooks.
# SFM / chip-load numbers below are published CATALOG STARTING POINTS, not
# Kannon shop times. Replace when Kyle supplies the tooling crib and insert grades.
#
# Setup minutes and non-cutting allowance are PLACEHOLDERS.

status: placeholder_catalog
placeholder: true
notes:
  - "Do not treat these minutes as shop-standard until Kyle replaces them."
  - "Formulas are public (Harvey Tool, Kennametal, MachiningDoctor, Sandvik). Rates are not."

formulas:
  rpm: "RPM = (SFM × 3.82) / D"
  milling_ipm: "IPM = RPM × IPT × flutes"
  milling_mrr: "MRR (in³/min) = DOC × WOC × IPM"
  milling_time_path: "cut_min = path_length_in / IPM"
  milling_time_volume: "cut_min = volume_in3 / MRR"
  turning_rpm: "n = (12 × SFM) / (π × D)   equivalently RPM = (SFM × 3.82) / D"
  turning_time: "T (min) = L / (n × IPR)   equivalently T = (L × π × D) / (12 × IPR × SFM)"
  turning_mrr: "MRR (in³/min) = 12 × SFM × IPR × DOC"
  quoted: "total_min = setup_min + (cut_min × non_cutting_factor × qty)"

sources:
  - name: Harvey Tool General Machining Guidelines
    url: https://www.harveytool.com/resources/general-machining-guidelines
    used_for:
      - "RPM = (3.82 × SFM) / D"
      - "IPM = RPM × IPT × T"
      - "Carbide end-mill SFM and IPT starting ranges by material"
  - name: Harvey Performance — Speeds and Feeds 101
    url: https://www.harveyperformance.com/in-the-loupe/speeds-and-feeds-101/
    used_for:
      - "SFM is material-driven; RPM scales with diameter"
  - name: Kennametal milling formulas (MSC reprint)
    url: https://www1.mscdirect.com/images/solutions/kennametal/millingTechInfoFormulas.pdf
    used_for:
      - "MRR = DOC × WOC × IPM"
  - name: Kennametal Speeds and Feeds Calculator
    url: https://www.kennametal.com/us/en/resources/engineering-calculators/miscellaneous/speed-and-feed.html
    used_for:
      - "RPM = (SFM × 3.82) / D"
      - "Feed = RPM × chip load × teeth"
  - name: MachiningDoctor turning calculators
    url: https://www.machiningdoctor.com/calculators/turning-calculators-2/
    used_for:
      - "n = 12 × Vc / (π × d)"
      - "T = L / (n × Fn)"
      - "Q = 12 × Vc × Fn × ap"
  - name: Sandvik Coromant — turning in different materials
    url: https://www.sandvik.coromant.com/en-us/knowledge/general-turning/how-to-do-turning-in-different-materials
    used_for:
      - "Method only (grade-specific vc is on the insert box — not copied here)"

# Default tools until the crib is filled. Kyle can add rows under tooling.* later.
defaults:
  mill:
    tool_id: em_050_4f
    tool_diameter_in: 0.5
    flutes: 4
    doc_fraction_of_d: 0.25   # axial DOC = 0.25 × D unless overridden
    woc_fraction_of_d: 0.50   # radial WOC = 0.50 × D unless overridden
    face_woc_fraction_of_d: 0.80
  lathe:
    rough_doc_in: 0.100
    finish_doc_in: 0.020
    finish_passes: 1
  drill:
    pecks_per_inch: 1.0       # placeholder; extra retracts not modeled yet

# PLACEHOLDER setup minutes — not Kannon shop times. Edit without a code change.
setup_minutes:
  placeholder: true
  cnc_lathe: 20
  cnc_lathe_live_tooling: 30
  cnc_mill_3axis: 25
  cnc_mill_4axis: 40
  cnc_mill_horizontal: 35
  robodrill: 15
  manual_mill: 30
  manual_lathe: 25

# PLACEHOLDER allowance for rapids / toolchange / approach. Not a shop measurement.
non_cutting_factor:
  placeholder: true
  value: 1.20
  notes: "cut_min is multiplied by this. Replace after time studies."

