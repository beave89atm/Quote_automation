# Machining calculator rates and tooling hooks.
# SFM / chip-load numbers below are published CATALOG STARTING POINTS, not
# Kannon shop times. Replace when Kyle supplies the tooling crib and insert grades.
#
# Setup minutes and non-cutting allowance are PLACEHOLDERS.

status: placeholder_catalog
placeholder: true
notes:
  - "Do not treat these minutes as shop-standard until Kyle replaces them."
  - "Formulas are public (Kennametal, CNC Optimization, Harvey Tool). SFM bands are placeholders — not Kannon-tooling-validated."

formulas:
  rpm: "RPM = (SFM × 3.82) / D   (D = tool Ø mill, workpiece Ø turn)"
  milling_ipm: "IPM = RPM × flutes × chip load"
  turning_ipm: "IPM = RPM × IPR   (no flute multiply)"
  milling_mrr: "MRR (in³/min) = WOC × DOC × IPM"
  turning_sfm_check: "SFM = 0.262 × part diameter × RPM"
  milling_time_path: "cut_min = path_length_in / IPM"
  milling_time_volume: "cut_min = volume_in3 / MRR"
  turning_time: "T (min) = L / (RPM × IPR)"
  quoted: "total_min = setup_min + (cut_min × non_cutting_factor × qty)"

sources:
  - name: Kennametal Speeds and Feeds Calculator
    url: https://www.kennametal.com/us/en/resources/engineering-calculators/miscellaneous/speed-and-feed.html
    used_for:
      - "RPM = (SFM × 3.82) / D"
      - "Mill feed = RPM × chip load × teeth"
      - "Turning SFM = 0.262 × part diameter × RPM"
  - name: CNC Optimization — CNC cutting speed and feed formulas
    url: https://www.cncoptimization.com/resources/guides/cnc-cutting-speed-feed-formulas/
    used_for:
      - "RPM = (SFM × 3.82) / diameter"
      - "Feed rate = RPM × flutes × chip load"
      - "Mill MRR = WOC × DOC × IPM"
  - name: Harvey Tool General Machining Guidelines
    url: https://www.harveytool.com/resources/general-machining-guidelines
    used_for:
      - "Same RPM and mill IPM formulas; IPT-by-diameter chip-load table"

# Default tools until the crib is filled. Kyle can add rows under tooling.* later.
defaults:
  mill:
    tool_id: em_050_4f
    tool_diameter_in: 0.5
    flutes: 4
    doc_fraction_of_d: 0.25   # axial DOC = 0.25 × D unless overridden
    woc_fraction_of_d: 0.50   # radial WOC = 0.50 × D unless overridden
    face_woc_fraction_of_d: 0.80
  lathe:
    rough_doc_in: 0.100
    finish_doc_in: 0.020
    finish_passes: 1
  drill:
    pecks_per_inch: 1.0       # placeholder; extra retracts not modeled yet

# Mill setup 20 min is STALE 2021 Sectura book (optional default only).
# Per-machine setup and 2026 burden rates are TODO — do not invent.
setup_minutes:
